[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soqindexer"
version = "0.1.0"
description = "Soqucoin chain indexer + Soqunes protocol state machine. Single writer, reorg-safe (fork-point rollback), SQLite or PostgreSQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Soqunes contributors" }]
keywords = ["bitcoin", "soqucoin", "indexer", "utxo", "post-quantum", "dilithium"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
soqindexer = "soqindexer.cli:main"

[project.urls]
Homepage = "https://github.com/friendlycryptoguy/soqunes-indexer"
Repository = "https://github.com/friendlycryptoguy/soqunes-indexer"

[tool.setuptools]
packages = ["soqindexer"]
