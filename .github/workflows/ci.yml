name: ci
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -v
  postgres:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16-alpine
        env: { POSTGRES_USER: soq, POSTGRES_PASSWORD: soq, POSTGRES_DB: soqindexer_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soq" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[postgres]"
      - run: python -m unittest discover -s tests -v
        env: { SOQINDEXER_TEST_DB: "postgres://soq:soq@localhost:5432/soqindexer_test" }
